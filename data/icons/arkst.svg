<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="arkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#090c14"/>
    </linearGradient>
    <linearGradient id="arkMark" x1="12%" y1="50%" x2="88%" y2="50%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="48%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <mask id="arkCutout">
      <rect width="512" height="512" fill="#ffffff"/>
      <!-- Inner triangle cutout -->
      <polygon points="256,204 220,288 292,288" fill="#000000"/>
      <!-- Minimalist upward ark crescent cutout -->
      <path d="M 134,344 Q 256,268 378,344 Q 256,292 134,344 Z" fill="#000000"/>
    </mask>
  </defs>

  <!-- Minimalist Matte Obsidian Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="114" ry="114" fill="url(#arkBg)"/>

  <!-- Minimalist Geometric Ark "A" Mark -->
  <path d="M 256,64 L 428,424 L 340,424 L 298,326 Q 256,310 214,326 L 172,424 L 84,424 Z"
        fill="url(#arkMark)"
        mask="url(#arkCutout)"/>
</svg>
