# =============================================================================
# Hyprland Window Rules & Keybind for ArkST (io.github.arkst)
# =============================================================================
# Sourced automatically in ~/.config/hypr/hyprland.conf

windowrule = float, class:^(io\.github\.arkst)$
windowrule = center, class:^(io\.github\.arkst)$
windowrule = size 1200 760, class:^(io\.github\.arkst)$

windowrule = float, class:^(arkst|arkst\.py)$
windowrule = center, class:^(arkst|arkst\.py)$
windowrule = size 1200 760, class:^(arkst|arkst\.py)$

# Float & center ArkST's native GTK4 authentication dialog
windowrule = float, class:^(io\.github\.arkst\.Askpass|io\.github\.arkst\.askpass|arkst-askpass)$
windowrule = center, class:^(io\.github\.arkst\.Askpass|io\.github\.arkst\.askpass|arkst-askpass)$
windowrule = size 430 240, class:^(io\.github\.arkst\.Askpass|io\.github\.arkst\.askpass|arkst-askpass)$
windowrule = pin, class:^(io\.github\.arkst\.Askpass|io\.github\.arkst\.askpass|arkst-askpass)$
windowrule = stayfocused, class:^(io\.github\.arkst\.Askpass|io\.github\.arkst\.askpass|arkst-askpass)$

# Instant Launcher Shortcut (Super + A)
unbind = SUPER, A
bind = SUPER, A, exec, arkst

